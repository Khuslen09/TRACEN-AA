name: tracen
description: "TRACEN - GPS 기반 라이프로그 앱."
publish_to: 'none'

version: 1.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  url_launcher: ^6.3.1

  # 로컬 DB
  # hive 제거 — 실제로 사용하지 않음 (sqflite로 대체됨)
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2

  # 상태 관리
  provider: ^6.1.2

  # 지도 & 위치
  google_maps_flutter: ^2.6.0
  geolocator: ^10.1.1
  geocoding: ^3.0.0
  shared_preferences: ^2.2.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.3
  google_sign_in: ^6.0.0

  # 사진
  image_picker: ^1.1.2
  camera: ^0.11.2
  image: ^4.5.0

  # 공유
  share_plus: ^11.0.0

  # 유틸
  uuid: ^4.4.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  flutter_foreground_task: ^8.16.0
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  flutter_svg: ^2.2.4
  flutter_dotenv: ^5.1.0
  cached_network_image: ^3.3.1
  gal: ^2.3.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/tracen_icon.png"
  adaptive_icon_background: "#05050B"
  adaptive_icon_foreground: "assets/icon/tracen_icon_foreground.png"
  adaptive_icon_foreground_inset: 28
  
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
    - assets/luts/
    - .env
  shaders:
    - shaders/lut_filter.frag